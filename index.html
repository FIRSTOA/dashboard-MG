  /* Modal */
  .modal-backdrop {

  /* Topbar buttons / sync badge */
  .topbar-btn {

  /* Header shortcut icon */

  /* Edit affordance on task / link items */

  /* mini calendar (board widget) */

      const res = await fetch(url, { method: 'GET' });

      const json = await res.json();
      if (json && json.ok && json.data && typeof json.data === 'object') {

  // CSV/TSV ??goals + missions
  function parseSheetData(text) {
    const isTsv = text.includes('\t');
    const result = Papa.parse(text, {
      delimiter: isTsv ? '\t' : ',',
      skipEmptyLines: false
    });
    const rows = result.data;
    console.log('[parseSheetData] parsed rows:', rows.length, rows);
    if (!rows || rows.length === 0) return { goals: [], missions: [] };

    const newGoals = [];
    const newMissions = [];
    let goalCounter = 0;
    let missionCounter = 0;

    // Step 1: 媛濡??몃줈 ?덉씠?꾩썐 ?먮룞 媛먯?
    // 媛濡? 媛숈? ?됱뿉 "湲곕낯?낅Т"? "誘몄뀡?낅Т"媛 紐⑤몢 ?덉쓬
    let missionColumnIndex = -1;
    let isHorizontal = false;
    for (let i = 0; i < Math.min(3, rows.length); i++) {
      const row = rows[i] || [];
      const joined = row.join(' ');
      if (joined.includes('誘몄뀡?낅Т') && (joined.includes('湲곕낯?낅Т') || joined.includes('援? 遺?) || joined.includes('援щ텇'))) {
        isHorizontal = true;
        for (let j = 0; j < row.length; j++) {
          if (String(row[j] || '').trim().includes('誘몄뀡?낅Т')) {
            missionColumnIndex = j;
            break;
          }
        }
        break;
      }
    }
    console.log('[parseSheetData] layout:', isHorizontal ? 'HORIZONTAL' : 'VERTICAL', 'missionCol:', missionColumnIndex);

    // ?ㅻ뜑???띿뒪??泥댄겕 (誘몄뀡?쇰줈 ?섎せ ?ㅼ뼱媛??寃?諛⑹?)
    const HEADER_WORDS = ['誘몄뀡?낅Т', '湲곕낯?낅Т', '援? 遺?, '援щ텇', '紐? ??, '紐⑺몴', '?낅Т ?깃툒', '?낅Т?깃툒', '?꾩옱 ?덈꺼', '紐⑺몴 ?덈꺼', '?붿껌?덉궛', '?덉궛諛섏쁺', '吏꾨룄??, '?곗꽑?쒖쐞'];
    function isHeaderText(s) {
      const t = String(s || '').trim();
      if (!t || t.length < 2) return true;
      if (HEADER_WORDS.some(h => t === h || t.replace(/\s+/g,'') === h.replace(/\s+/g,''))) return true;
      if (VALID_CATS.has(t)) return true;
      if (/^[A-D]$/.test(t)) return true;
      if (/^\d+%?$/.test(t)) return true;
      if (/^\d+\.?\d*$/.test(t)) return true;
      return false;
    }

    function extractGoal(row) {
      let category = '', grade = '', body = '';
      for (const cell of row) {
        const v = String(cell || '').trim();
        if (VALID_CATS.has(v)) { category = v; break; }
      }
      for (const cell of row) {
        const v = String(cell || '').trim();
        if (/^[A-D]$/.test(v)) { grade = v; break; }
      }
      let maxLen = 0;
      for (const cell of row) {
        const v = String(cell || '').trim();
        if (v && v !== category && v !== grade && !VALID_CATS.has(v) && !/^[A-D]$/.test(v) && v.length > maxLen) {
          maxLen = v.length;
          body = v;
        }
      }
      if (!category && !grade) return null;
      if (!body || body.length < 8) return null;
      if (!category) category = '湲고?';
      if (!grade) grade = 'C';

      const lines = body.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) return null;
      let title = lines[0].replace(/^\d+\.\s*/, '').trim();
      let purpose = '', method = '';
      if (lines.length >= 3) {
        purpose = lines.slice(1, -1).join(' ');
        method = lines[lines.length - 1];
      } else if (lines.length === 2) {
        purpose = lines[1];
      }
      return { title, category, grade, purpose, method };
    }

    if (isHorizontal) {
      // 媛濡??덉씠?꾩썐: 媛??됱뿉??遺꾧린 紐⑺몴? 誘몄뀡???숈떆??異붿텧
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0) continue;
        const joined = row.join(' ').trim();
        if (!joined) continue;
        // ?ㅻ뜑 ???ㅽ궢
        if (joined.includes('誘몄뀡?낅Т') || joined.includes('湲곕낯?낅Т')) continue;
        if (/^[\s]*(援?s*遺?紐?s*???낅Т\s*?깃툒|?꾩옱\s*?덈꺼|紐⑺몴\s*?덈꺼)/.test(joined)) continue;

        // 遺꾧린 紐⑺몴 異붿텧
        const goalData = extractGoal(row);
        if (goalData) {
          goalCounter++;
          newGoals.push({ id: `g${Date.now()}-${goalCounter}`, ...goalData, done: false });
        }

        // 誘몄뀡 異붿텧 (誘몄뀡 而щ읆?먯꽌)
        if (missionColumnIndex >= 0 && missionColumnIndex < row.length) {
          const missionCell = String(row[missionColumnIndex] || '').trim();
          if (missionCell && missionCell.length > 1 && !isHeaderText(missionCell)) {
            missionCounter++;
            newMissions.push({ id: `m${Date.now()}-${missionCounter}`, title: missionCell, done: false });
          }
        }
      }
    } else {
      // ?몃줈 ?덉씠?꾩썐
      let inMissionMode = false;
      const MISSION_TRIGGERS = ['誘몄뀡?낅Т', '異붽?誘몄뀡', '異붽? 誘몄뀡', 'missions'];
      const HEADER_TRIGGERS = ['湲곕낯?낅Т', '湲곕낯 ?낅Т', '遺꾧린紐⑺몴', '遺꾧린 紐⑺몴', '1遺꾧린 紐⑺몴', '2遺꾧린 紐⑺몴', '3遺꾧린 紐⑺몴', '4遺꾧린 紐⑺몴'];

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0) continue;
        const joined = row.join(' ').trim();
        if (!joined) continue;

        // ?뺥솗???쇱튂?섍굅???⑥뼱 ?⑥쐞濡??쒖옉?섎뒗 寃쎌슦留??몃━嫄?留ㅼ튂
        const isMissionHeader = MISSION_TRIGGERS.some(t => joined === t || joined.startsWith(t + ' ') || joined.startsWith(t + '\t'));
        if (isMissionHeader) { inMissionMode = true; continue; }
        const isQuarterHeader = HEADER_TRIGGERS.some(t => joined === t || joined.startsWith(t + ' ') || joined.startsWith(t + '\t'));
        if (isQuarterHeader) { inMissionMode = false; continue; }

        if (inMissionMode) {
          const t = row.find(c => c && String(c).trim().length > 1);
          if (t) {
            const cleaned = String(t).trim();
            if (!isHeaderText(cleaned)) {
              missionCounter++;
              newMissions.push({ id: `m${Date.now()}-${missionCounter}`, title: cleaned, done: false });
            }
          }
          continue;
        }

        const goalData = extractGoal(row);
        if (goalData) {
          goalCounter++;
          newGoals.push({ id: `g${Date.now()}-${goalCounter}`, ...goalData, done: false });
        }
      }
    }

    console.log('[parseSheetData] result:', { goals: newGoals.length, missions: newMissions.length });
    return { goals: newGoals, missions: newMissions };
  }

  async function fileToResizedDataURL(file, maxSide = 800, quality = 0.78) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = Math.round(img.width * ratio), h = Math.round(img.height * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  function enableDragReorder(container, itemSelector, getArray, onReorder) {
    let dragEl = null;
    container.querySelectorAll(itemSelector).forEach(el => {
      el.setAttribute('draggable', 'true');
      el.addEventListener('dragstart', (e) => {
        dragEl = el; el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', el.dataset.id || ''); } catch (x) {}
      });
      el.addEventListener('dragend', () => {
        el.classList.remove('dragging');
        container.querySelectorAll(itemSelector).forEach(x => x.classList.remove('drag-over-top', 'drag-over-bottom'));
        dragEl = null;
      });
      el.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!dragEl || dragEl === el) return;
        const r = el.getBoundingClientRect();
        const after = (e.clientY - r.top) > r.height / 2;
        el.classList.toggle('drag-over-bottom', after);
        el.classList.toggle('drag-over-top', !after);
      });
      el.addEventListener('dragleave', () => el.classList.remove('drag-over-top', 'drag-over-bottom'));
      el.addEventListener('drop', (e) => {
        e.preventDefault();
        if (!dragEl || dragEl === el) return;
        const arr = getArray();
        const fromId = dragEl.dataset.id;
        const toId = el.dataset.id;
        const from = arr.findIndex(x => String(x.id) === String(fromId));
        if (from < 0) return;
        const r = el.getBoundingClientRect();
        const after = (e.clientY - r.top) > r.height / 2;
        const [moved] = arr.splice(from, 1);
        let to = arr.findIndex(x => String(x.id) === String(toId));
        if (to < 0) to = arr.length - 1;
        arr.splice(after ? to + 1 : to, 0, moved);
        onReorder(arr);
      });
    });
  }

  function ensureXLSX() {
    if (window.XLSX) return Promise.resolve();
    if (window._xlsxLoading) return window._xlsxLoading;
    const urls = [
      'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
      'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
      'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'
    ];
    window._xlsxLoading = new Promise((resolve, reject) => {
      let i = 0;
      const tryNext = () => {
        if (window.XLSX) return resolve();
        if (i >= urls.length) return reject(new Error('?묒? ?뚯꽌瑜?遺덈윭?ㅼ? 紐삵뻽?댁슂(?명꽣???뺤씤).'));
        const s = document.createElement('script');
        s.src = urls[i++];
        s.onload = () => window.XLSX ? resolve() : tryNext();
        s.onerror = tryNext;
        document.head.appendChild(s);
      };
      tryNext();
    });
    return window._xlsxLoading;
  }

  function compressImage(file, maxW = 900, quality = 0.82) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxW / img.width);
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject; img.src = reader.result;
      };
      reader.onerror = reject; reader.readAsDataURL(file);
    });
  }

  let userMenuEl = null;
  function closeUserMenu() { if (userMenuEl) { userMenuEl.remove(); userMenuEl = null; } }
  function toggleUserMenu() {
    if (userMenuEl) { closeUserMenu(); return; }
    const badge = document.getElementById('userBadge');
    const rect = badge.getBoundingClientRect();
    const m = document.createElement('div');
    m.className = 'user-menu';
    m.style.top = (rect.bottom + 6) + 'px';
    m.style.right = Math.max(8, window.innerWidth - rect.right) + 'px';
    m.innerHTML = `<button data-act="pw">?뵎 鍮꾨?踰덊샇 蹂寃?/button><button data-act="out">?슞 濡쒓렇?꾩썐</button>`;
    document.body.appendChild(m);
    userMenuEl = m;

      } catch (e) { alert('?ㅻ쪟: ' + (e.message || e)); }
    });
    m.querySelector('[data-act="out"]').addEventListener('click', () => { closeUserMenu(); if (confirm('濡쒓렇?꾩썐 ?섏떆寃좎뼱??')) doLogout(); });
  }
  document.addEventListener('click', (e) => { if (userMenuEl && !userMenuEl.contains(e.target) && e.target.id !== 'userBadge') closeUserMenu(); });
